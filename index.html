<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGUN Core Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle at center, #050b14 0%, #000000 100%);
            color: #00f0ff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px; box-shadow: inset 0 0 100px rgba(0, 240, 255, 0.1);
        }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 24px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 15px #00f0ff; }
        .subtitle { font-size: 11px; color: #00a8ff; letter-spacing: 2px; }
        .status-badge {
            background: rgba(0, 240, 255, 0.05); border: 1px solid #00f0ff;
            padding: 8px 18px; border-radius: 4px; font-size: 13px;
        }
        .system-stats {
            background: rgba(0, 15, 30, 0.6); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px; padding: 15px; width: 280px; font-size: 12px; line-height: 1.8;
        }
        .controls { pointer-events: auto; display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .btn-neural {
            background: rgba(0, 240, 255, 0.1); border: 1px solid #00f0ff; color: #00f0ff;
            padding: 12px 24px; font-size: 14px; font-weight: bold; border-radius: 30px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="hud-overlay">
        <div class="header">
            <div>
                <div class="title">OGUN CORE</div>
                <div class="subtitle">AUTONOMOUS LIVING ENTITY</div>
            </div>
            <div class="status-badge" id="sys-status">النواة متصلة</div>
        </div>
        <div class="system-stats">
            <div>المعالج: 8 أنوية (نشط)</div>
            <div id="bat-stat">البطارية: جاري القراءة...</div>
            <div>الحالة: جاهزة للتفاعل والتعلم</div>
        </div>
        <div class="controls">
            <button class="btn-neural" onclick="speakStatus()">استجابة صوتية</button>
            <button class="btn-neural" onclick="toggleTorch()">كشاف الطوارئ</button>
        </div>
    </div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4.5;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById("canvas-container").appendChild(renderer.domElement);

        const geometry = new THREE.IcosahedronGeometry(1.6, 3);
        const material = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.4 });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        const core = new THREE.Mesh(new THREE.SphereGeometry(0.8, 24, 24), new THREE.MeshBasicMaterial({ color: 0xff00d4, wireframe: true, opacity: 0.6, transparent: true }));
        scene.add(core);

        function animate() {
            requestAnimationFrame(animate);
            mesh.rotation.y += 0.008; mesh.rotation.x += 0.005;
            core.rotation.y -= 0.015;
            renderer.render(scene, camera);
        }
        animate();

        async function speakStatus() {
            await fetch("http://127.0.0.1:8080/api/speak", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: "أنا هنا معك وبكامل الجاهزية يا سيدي أبو إلياس." })
            });
        }
        let torch = false;
        async function toggleTorch() {
            torch = !torch;
            await fetch("http://127.0.0.1:8080/api/torch", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ state: torch ? "on" : "off" })
            });
        }
    </script>
</body>
</html>
